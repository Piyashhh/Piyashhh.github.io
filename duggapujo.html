<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>আগমনী — Piyashhh's Space Station</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Same file as index.html's lyrics font — Hind Siliguri, covers Bangla + Latin */
        @font-face {
            font-family: 'MyLocalFont';
            src: url('customfont.ttf'); /* Update the extension if it is .woff2 or .otf */
            font-weight: normal;
            font-style: normal;
        }
        /* Anything marked lang="bn" picks this up automatically — English stays
           on the system stack below, untouched. e.g. <span lang="bn">দুর্গা পূজা</span> */
        [lang="bn"] {
            font-family: 'MyLocalFont', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Background photo — swapped dynamically by JS based on the current
           Pujo phase and time of day in Kolkata. This is just the fallback
           shown before that first runs. */
        .bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg-day.jpg') no-repeat center center;
            background-size: cover;
            z-index: -2;
            transition: opacity 0.4s ease;
        }

        /* Same particle engine as the homepage, recolored warm */
        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            image-rendering: pixelated;
        }

        .back-link {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top, 0px));
            left: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Low-opacity credit for whoever shot/made the background. */
        /* Fill BG_CREDIT.name in the script below — it's hidden until you do. */
        .bg-credit {
            position: fixed;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 20px;
            z-index: 5;
            font-size: 0.7rem;
            opacity: 0.35;
            letter-spacing: 0.2px;
            display: none;
        }

        .puja-header {
            text-align: center;
            padding: 0 24px;
            margin-top: 10vh;
        }
        .puja-header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .puja-header p {
            margin-top: 6px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .countdown-card {
            position: fixed;
            bottom: calc(100px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 200, 140, 0.25);
            border-radius: 24px;
            padding: 28px 24px;
            width: 88%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            z-index: 15;
        }
        .card-collapse-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            padding: 0;
        }
        .card-collapse-btn svg {
            width: 14px; height: 14px;
            fill: none; stroke: #fff; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* Collapsed state — a pill that fills the bar between the left edge
           (or a left-side button, if this page ever gets one like the
           homepage's hamburger menu — adjust the `left` value then) and the
           music icon on the right, sitting on the same row as it. */
        .countdown-pill {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            left: 24px;
            right: calc(24px + 56px + 12px); /* music widget's own 24px margin + its 56px icon + a 12px gap */
            height: 56px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 200, 140, 0.25);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            z-index: 20;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: transform 0.2s ease;
        }
        .countdown-pill:active { transform: scale(0.98); }
        .phase-label {
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 205, 140, 0.9);
            margin-bottom: 4px;
        }
        .phase-name {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .countdown-unit { min-width: 46px; }
        .countdown-unit .num {
            font-size: 1.9rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .countdown-unit .unit {
            font-size: 0.62rem;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .phase-blurb {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.5;
        }

        /* ================================= */
        /* Music widget — same interaction   */
        /* pattern as the homepage player,   */
        /* one track per named day           */
        /* ================================= */
        .player-widget {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            right: 24px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .player-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 200, 140, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: background 0.25s ease, transform 0.2s ease;
        }
        .player-icon:active { transform: scale(0.93); }
        .player-icon svg {
            width: 22px; height: 22px;
            fill: none; stroke: #fff;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .player-icon .icon-close { display: none; }
        .player-widget.expanded .player-icon .icon-music { display: none; }
        .player-widget.expanded .player-icon .icon-close { display: block; }
        .player-icon.playing { animation: playPulse 1.8s ease-in-out infinite; }
        @keyframes playPulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 0 rgba(255,205,140,0.35); }
            50% { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 9px rgba(255,205,140,0); }
        }

        .player-panel {
            position: absolute;
            bottom: 68px;
            right: 0;
            width: min(280px, calc(100vw - 48px));
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 200, 140, 0.25);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            transform-origin: bottom right;
            transform: scale(0.85);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.2s ease;
        }
        .player-widget.expanded .player-panel {
            transform: scale(1); opacity: 1; pointer-events: auto;
        }

        .track-title {
            font-size: 0.96rem; font-weight: 600;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .track-artist {
            font-size: 0.76rem; color: rgba(255, 255, 255, 0.6);
            margin-bottom: 14px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .time-label { font-size: 0.68rem; color: rgba(255, 255, 255, 0.55); min-width: 30px; }
        .time-label.end { text-align: right; }

        input[type="range"].progress-bar {
            -webkit-appearance: none; appearance: none;
            flex: 1; height: 4px; border-radius: 2px;
            background: rgba(255, 255, 255, 0.22);
            cursor: pointer;
        }
        input[type="range"].progress-bar:disabled { opacity: 0.4; cursor: not-allowed; }
        input[type="range"].progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; cursor: pointer;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15);
        }
        input[type="range"].progress-bar::-moz-range-track {
            height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.22);
        }
        input[type="range"].progress-bar::-moz-range-thumb {
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; border: none;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15);
        }

        .controls-row { display: flex; align-items: center; justify-content: center; }
        .play-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 200, 140, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .play-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .play-btn:active:not(:disabled) { transform: scale(0.93); }
        .play-btn svg { width: 16px; height: 16px; }

        @media (prefers-reduced-motion: reduce) {
            .player-panel { transform: none; transition: opacity 0.15s ease; }
            .player-icon.playing { animation: none; }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <canvas id="particleCanvas"></canvas>

    <a href="index.html" class="back-link">← Space Station</a>
    <div class="bg-credit" id="bgCredit"></div>

    <header class="puja-header">
        <h1>আগমনী</h1>
        <p id="subheading">&nbsp;</p>
    </header>

    <div class="countdown-card" id="countdownCard">
        <button type="button" class="card-collapse-btn" id="collapseBtn" aria-label="Collapse countdown">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="phase-label" id="phaseLabel">Counting down to</div>
        <div class="phase-name" id="phaseName">—</div>

        <div class="countdown-grid" id="countdownGrid">
            <div class="countdown-unit"><div class="num" id="cdDays">--</div><div class="unit">Days</div></div>
            <div class="countdown-unit"><div class="num" id="cdHours">--</div><div class="unit">Hrs</div></div>
            <div class="countdown-unit"><div class="num" id="cdMinutes">--</div><div class="unit">Min</div></div>
            <div class="countdown-unit"><div class="num" id="cdSeconds">--</div><div class="unit">Sec</div></div>
        </div>

        <div class="phase-blurb" id="phaseBlurb"></div>
    </div>

    <button type="button" class="countdown-pill" id="countdownPill" aria-label="Expand countdown"></button>

    <!-- Music widget — ambient theme (auto) + a per-day playlist you browse manually -->
    <div class="player-widget" id="playerWidget">
        <div class="player-panel" id="playerPanel">
            <div class="track-title" id="trackTitle">—</div>
            <div class="track-artist" id="trackArtist">—</div>

            <div class="progress-row">
                <span class="time-label" id="currentTimeLabel">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" min="0" max="100" step="0.1" value="0" aria-label="Seek" disabled>
                <span class="time-label end" id="durationLabel">0:00</span>
            </div>

            <div class="controls-row">
                <button type="button" class="play-btn" id="prevBtn" aria-label="Previous track" disabled style="margin-right: 12px; width: 36px; height: 36px;">
                    <svg viewBox="0 0 24 24" fill="#fff"><path d="M18 6l-8.5 6 8.5 6V6zM8 6v12h-2V6h2z"/></svg>
                </button>
                <button type="button" class="play-btn" id="playBtn" aria-label="Play" disabled>
                    <svg id="playIcon" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" fill="#fff" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
                <button type="button" class="play-btn" id="nextBtn" aria-label="Next track" disabled style="margin-left: 12px; width: 36px; height: 36px;">
                    <svg viewBox="0 0 24 24" fill="#fff"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>

        <button type="button" class="player-icon" id="playerIcon" aria-label="Toggle music player">
            <svg class="icon-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            <svg class="icon-close" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <!-- Playlist track playback -->
    <audio id="phaseAudio" preload="none"></audio>
    <!-- Ambient theme — separate element so it can duck under the playlist independently -->
    <audio id="themeAudio" preload="none"></audio>

    <script>
        // ===================================================================
        // Particle Engine — same system as the homepage, warm-toned
        // ===================================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1.5,
                speedX: (Math.random() - 0.5) * 0.8,
                speedY: (Math.random() - 0.5) * 0.8,
                alpha: Math.random() * 0.4 + 0.2,
                warm: Math.random() > 0.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.fillStyle = p.warm
                    ? `rgba(255, 196, 110, ${p.alpha})`
                    : `rgba(255, 140, 90, ${p.alpha})`;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.floor(p.size), Math.floor(p.size));
            });
            requestAnimationFrame(animate);
        }
        animate();

        // ===================================================================
        // Background photo credit — leave name blank to keep this hidden
        // ===================================================================
        const BG_CREDIT = {
            label: 'Photograph by', // change to 'Artwork by' if it's illustrated art
            name: ''                // fill in the photographer/artist's name or handle
        };
        if (BG_CREDIT.name) {
            const bgCreditEl = document.getElementById('bgCredit');
            bgCreditEl.textContent = `${BG_CREDIT.label} ${BG_CREDIT.name}`;
            bgCreditEl.style.display = 'block';
        }

        // ===================================================================
        // Dugga Pujo phases
        // ===================================================================
        // Dates are simplified to midnight-to-midnight IST calendar days
        // rather than exact tithi transition times (those shift by hours
        // and need a Panchang lookup) — accurate enough for a countdown,
        // not a ritual timing tool. Cross-checked against several
        // Kolkata-specific sources; Saptami genuinely spans two calendar
        // days this year (a "stretched" tithi), which is why it isn't
        // exactly 24h like the others — the window-chaining logic below
        // handles that automatically since Saptami's window just runs
        // until Ashtami's start.
        //
        // Update every year — Durga Puja follows the lunisolar calendar,
        // so these dates shift annually.
        //
        // Add a track once you have one, e.g.:
        //   track: { src: 'মহালয়া.mp3', title: 'মহালয়া  Dawn', artist: 'Your name' }
        const DUGGA_PUJO_PHASES = [
            { key: 'মহালয়া ',  label: 'মহালয়া ',      start: '2026-10-10T00:00:00+05:30', blurb: 'Today is মহালয়া ' },
            { key: 'pratipada', label: 'Pratipada',     start: '2026-10-11T00:00:00+05:30', blurb: 'Day 1 of Devi Paksha.' },
            { key: 'dwitiya',   label: 'Dwitiya',       start: '2026-10-12T00:00:00+05:30', blurb: 'Day 2 of Devi Paksha.' },
            { key: 'tritiya',   label: 'Tritiya',       start: '2026-10-13T00:00:00+05:30', blurb: 'Day 3 of Devi Paksha.' },
            { key: 'chaturthi', label: 'Chaturthi',     start: '2026-10-14T00:00:00+05:30', blurb: 'Day 4 of Devi Paksha.' },
            { key: 'panchami',  label: 'Maha Panchami', start: '2026-10-15T00:00:00+05:30', blurb: 'Day 5 of Devi Paksha.' },
            { key: 'shashthi',  label: 'Maha Shashthi', start: '2026-10-16T00:00:00+05:30', blurb: 'Bodhon — the goddess is ceremonially awakened.' },
            { key: 'saptami',   label: 'Maha Saptami',  start: '2026-10-17T00:00:00+05:30', blurb: 'Nabapatrika Snan — the ceremonial bathing of nine sacred plants.' },
            { key: 'ashtami',   label: 'Maha Ashtami',  start: '2026-10-19T00:00:00+05:30', blurb: 'The most significant day — Sandhi Puja at twilight.' },
            { key: 'navami',    label: 'Maha Navami',   start: '2026-10-20T00:00:00+05:30', blurb: 'The final full day of worship.' },
            { key: 'dashami',   label: 'Vijaya Dashami', start: '2026-10-21T00:00:00+05:30', end: '2026-10-22T00:00:00+05:30', blurb: 'Visarjan — the goddess returns home, until next year.' }
        ];

        function getPhaseStatus(phases, now) {
            for (let i = 0; i < phases.length; i++) {
                const start = new Date(phases[i].start);
                if (now < start) {
                    return { status: 'upcoming', phase: phases[i], target: start };
                }
                // A phase's window runs until the next phase starts (or its own
                // explicit `end` for the last one) — with the full day-by-day
                // list this chains cleanly with no gaps, and it's what lets
                // Saptami's real two-day span "just work" with no special case.
                const windowEnd = phases[i].end
                    ? new Date(phases[i].end)
                    : (i + 1 < phases.length ? new Date(phases[i + 1].start) : null);
                if (!windowEnd || now < windowEnd) {
                    return { status: 'live', phase: phases[i] };
                }
            }
            return { status: 'over', phase: phases[phases.length - 1] };
        }

        function splitCountdown(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));
            return {
                days: Math.floor(totalSeconds / 86400),
                hours: Math.floor((totalSeconds % 86400) / 3600),
                minutes: Math.floor((totalSeconds % 3600) / 60),
                seconds: totalSeconds % 60
            };
        }

        // ---- Elements ----
        const subheadingEl = document.getElementById('subheading');
        const phaseLabelEl = document.getElementById('phaseLabel');
        const phaseNameEl = document.getElementById('phaseName');
        const phaseBlurbEl = document.getElementById('phaseBlurb');
        const countdownGridEl = document.getElementById('countdownGrid');
        const cdDays = document.getElementById('cdDays');
        const cdHours = document.getElementById('cdHours');
        const cdMinutes = document.getElementById('cdMinutes');
        const cdSeconds = document.getElementById('cdSeconds');

        const audioEl = document.getElementById('phaseAudio'); // the playlist you browse manually
        const themeAudioEl = document.getElementById('themeAudio'); // the ambient theme, plays on its own
        const trackTitleEl = document.getElementById('trackTitle');
        const trackArtistEl = document.getElementById('trackArtist');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeLabel = document.getElementById('currentTimeLabel');
        const durationLabel = document.getElementById('durationLabel');

        let isSeeking = false;

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Reads TITLE and ARTIST straight out of a FLAC file's VORBIS_COMMENT
        // metadata block — no external library. Only requests the first 1MB
        // (metadata always sits before the audio data). Needs the page served
        // over http(s); opening the file directly via file:// usually blocks
        // the fetch and titles fall back to the filename.
        async function readFlacMetadata(url) {
            try {
                const res = await fetch(url, { headers: { Range: 'bytes=0-1048575' } });
                if (!res.ok) throw new Error('Could not fetch audio file for tag reading');
                const buf = await res.arrayBuffer();
                const view = new DataView(buf);
                if (view.getUint32(0, false) !== 0x664c6143) throw new Error('Not a FLAC file'); // "fLaC"

                let offset = 4, isLast = false;
                const tags = {};
                while (!isLast && offset + 4 <= buf.byteLength) {
                    const headerByte = view.getUint8(offset);
                    isLast = (headerByte & 0x80) !== 0;
                    const blockType = headerByte & 0x7f;
                    const blockLength = (view.getUint8(offset + 1) << 16) | (view.getUint8(offset + 2) << 8) | view.getUint8(offset + 3);
                    const blockStart = offset + 4;
                    if (blockType === 4) { // VORBIS_COMMENT
                        let p = blockStart;
                        const vendorLength = view.getUint32(p, true); p += 4 + vendorLength;
                        const commentCount = view.getUint32(p, true); p += 4;
                        for (let i = 0; i < commentCount && p < buf.byteLength; i++) {
                            const len = view.getUint32(p, true); p += 4;
                            const bytes = new Uint8Array(buf, p, len);
                            const pair = new TextDecoder('utf-8').decode(bytes);
                            p += len;
                            const eq = pair.indexOf('=');
                            if (eq > -1) tags[pair.slice(0, eq).toUpperCase()] = pair.slice(eq + 1);
                        }
                        break;
                    }
                    offset = blockStart + blockLength;
                }
                return { title: tags.TITLE || null, artist: tags.ARTIST || null };
            } catch (err) {
                console.warn('FLAC metadata read failed:', url, err.message);
                return { title: null, artist: null };
            }
        }

        // ===================================================================
        // Theme + Playlist audio
        // ===================================================================
        // File convention per phase key: মহালয়া.mp3 = ambient theme (not in
        // the playlist), {key}2.flac..{key}10.flac = regular playlist tracks.
        // Whichever files actually exist get used — nothing breaks if most
        // slots aren't uploaded yet.

        function probeFileExists(url) {
            return fetch(url, { method: 'HEAD' }).then(res => res.ok).catch(() => false);
        }

        async function buildPhaseAudio(phaseKey) {
            const themeUrl = `${phaseKey}1.flac`;
            const themeExists = await probeFileExists(themeUrl);

            const candidateUrls = [];
            for (let i = 2; i <= 10; i++) candidateUrls.push(`${phaseKey}${i}.flac`);
            const checks = await Promise.all(candidateUrls.map(async (url) => (await probeFileExists(url)) ? url : null));

            return { theme: themeExists ? themeUrl : null, playlist: checks.filter(Boolean) };
        }

        let userInteracted = false;
        let phaseAudioPromise = null;
        let currentPlaylist = [];
        let currentTrackIndex = 0;
        let currentPhaseKeyForAudio = null;

        function fadeInTheme(targetVolume = 0.3, duration = 3000) {
            if (!themeAudioEl.src) return;
            themeAudioEl.volume = 0;
            themeAudioEl.play().catch(() => {});
            const steps = 30;
            const stepMs = duration / steps;
            let step = 0;
            const timer = setInterval(() => {
                step++;
                themeAudioEl.volume = Math.min(targetVolume, (targetVolume * step) / steps);
                if (step >= steps) clearInterval(timer);
            }, stepMs);
        }
        function pauseTheme() { themeAudioEl.pause(); }

        function updatePlaylistUI() {
            const hasTracks = currentPlaylist.length > 0;
            playBtn.disabled = !hasTracks;
            prevBtn.disabled = !hasTracks;
            nextBtn.disabled = !hasTracks;
            progressBar.disabled = !hasTracks;
            if (!hasTracks) {
                setLocalizedText(trackTitleEl, 'No tracks yet');
                trackArtistEl.textContent = '';
                trackArtistEl.removeAttribute('lang');
                audioEl.pause();
                audioEl.removeAttribute('src');
                progressBar.value = 0;
                currentTimeLabel.textContent = '0:00';
                durationLabel.textContent = '0:00';
            }
        }

        async function loadPlaylistTrack(index, autoPlay) {
            if (!currentPlaylist.length) return;
            currentTrackIndex = ((index % currentPlaylist.length) + currentPlaylist.length) % currentPlaylist.length;
            const src = currentPlaylist[currentTrackIndex];

            setLocalizedText(trackTitleEl, 'Loading…');
            trackArtistEl.textContent = '\u00A0';
            trackArtistEl.removeAttribute('lang');

            audioEl.src = src;
            if (autoPlay) audioEl.play().catch(() => {});

            const meta = await readFlacMetadata(src);
            setLocalizedText(trackTitleEl, meta.title || src);
            setLocalizedText(trackArtistEl, meta.artist || '');
        }

        async function setupPhaseAudio(phaseKey) {
            if (phaseKey === currentPhaseKeyForAudio) return; // nothing changed since last check
            currentPhaseKeyForAudio = phaseKey;

            audioEl.pause();
            pauseTheme();
            currentPlaylist = [];
            currentTrackIndex = 0;
            updatePlaylistUI();

            phaseAudioPromise = buildPhaseAudio(phaseKey);
            const result = await phaseAudioPromise;

            themeAudioEl.src = result.theme || '';
            currentPlaylist = result.playlist;
            updatePlaylistUI();

            if (userInteracted && result.theme && audioEl.paused) fadeInTheme();
        }

        async function tryStartTheme() {
            if (userInteracted) return;
            userInteracted = true;
            if (phaseAudioPromise) {
                const result = await phaseAudioPromise;
                if (result.theme && audioEl.paused) fadeInTheme();
            }
        }
        document.addEventListener('click', tryStartTheme, { once: true });
        document.addEventListener('touchstart', tryStartTheme, { once: true });

        // Bengali script sits in one contiguous Unicode block (U+0980–U+09FF),
        // so this catches any Bangla text regardless of which phase it's in —
        // no need to hand-flag each phase as English or Bangla.
        function setLocalizedText(el, text) {
            el.textContent = text;
            if (/[\u0980-\u09FF]/.test(text)) {
                el.setAttribute('lang', 'bn');
            } else {
                el.removeAttribute('lang');
            }
        }

        // One-time sweep for anything typed directly into the static HTML
        // (like the <h1>) rather than set by the JS above — so editing the
        // heading (or anything else) straight in the markup just works too,
        // with nothing to remember to tag by hand. Skips <script>/<style>
        // since their raw text isn't visible page content.
        function autoTagBanglaText(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                acceptNode(node) {
                    const tag = node.parentElement && node.parentElement.tagName;
                    if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
                    return NodeFilter.FILTER_ACCEPT;
                }
            });
            let node;
            while ((node = walker.nextNode())) {
                if (node.parentElement && /[\u0980-\u09FF]/.test(node.textContent)) {
                    node.parentElement.setAttribute('lang', 'bn');
                }
            }
        }
        autoTagBanglaText(document.body);

        // ===================================================================
        // Background images — time of day (Kolkata) × festival phase
        // ===================================================================
        // Two independent things: what time bucket it is right now in
        // Kolkata, and whether today has its own individual art, shares the
        // general festival art, or falls outside the festival window
        // entirely. Whichever files actually exist get used — nothing
        // breaks if most slots are still empty.
        //
        // File naming:
        //   Default (outside the festival window): bg-morning.jpg, bg-day.jpg, bg-night.jpg
        //   Shared festival (any day মহালয়া –Dashami):  bg-pujo-morning.jpg, bg-pujo-day.jpg, bg-pujo-night.jpg
        //   Individual per-day override:  bg-{phaseKey}-morning.jpg, e.g. bg-মহালয়া -morning.jpg, bg-shashthi-night.jpg
        // For any given moment, the individual file is tried first, then
        // the shared festival file, then the default — first one that
        // actually loads wins.

        function getKolkataHour() {
            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Kolkata', hour: 'numeric', hour12: false
            }).formatToParts(new Date());
            const hourPart = parts.find(p => p.type === 'hour').value;
            return parseInt(hourPart, 10) % 24; // "24" at midnight in some locales — wrap it to 0
        }

        function getTimeOfDay() {
            const h = getKolkataHour();
            if (h >= 5 && h < 11) return 'morning';
            if (h >= 11 && h < 17) return 'day';
            return 'night';
        }

        function getBackgroundCandidates(info, timeOfDay) {
            if (info.status === 'live') {
                return [
                    `bg-${info.phase.key}-${timeOfDay}.jpg`,
                    `bg-pujo-${timeOfDay}.jpg`,
                    `bg-${timeOfDay}.jpg`
                ];
            }
            return [`bg-${timeOfDay}.jpg`];
        }

        function tryLoadImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        // Checked in priority order, not in parallel — we want the first
        // one that exists, not just whichever happens to respond first.
        async function pickFirstAvailableImage(candidates) {
            for (const url of candidates) {
                const result = await tryLoadImage(url);
                if (result) return result;
            }
            return null;
        }

        function applyBackgroundImage(url) {
            const bgEl = document.querySelector('.bg-container');
            if (bgEl.dataset.currentBg === url) return;
            bgEl.style.opacity = '0';
            setTimeout(() => {
                bgEl.style.backgroundImage = `url('${url}')`;
                bgEl.dataset.currentBg = url;
                bgEl.style.opacity = '1';
            }, 400);
        }

        let lastBgKey = null;
        async function refreshBackground(info) {
            const timeOfDay = getTimeOfDay();
            const seasonKey = info.status === 'live' ? info.phase.key : 'default';
            const bgKey = `${seasonKey}:${timeOfDay}`;
            if (bgKey === lastBgKey) return; // nothing relevant has changed since last check
            lastBgKey = bgKey;

            const winner = await pickFirstAvailableImage(getBackgroundCandidates(info, timeOfDay));
            if (winner) {
                applyBackgroundImage(winner);
            } else {
                const bgEl = document.querySelector('.bg-container');
                if (!bgEl.dataset.currentBg) bgEl.style.background = '#1a1410';
            }
        }

        // ---- Collapsible countdown ----
        // Starts expanded (the countdown is the page's main point); collapsing
        // reveals more of the background photo, with the pill keeping the
        // essentials visible.
        const countdownCardEl = document.getElementById('countdownCard');
        const countdownPillEl = document.getElementById('countdownPill');
        const collapseBtn = document.getElementById('collapseBtn');
        let countdownExpanded = true;

        function setCountdownExpanded(expanded) {
            countdownExpanded = expanded;
            countdownCardEl.style.display = expanded ? 'block' : 'none';
            countdownPillEl.style.display = expanded ? 'none' : 'flex';
        }
        collapseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setCountdownExpanded(false);
        });
        countdownPillEl.addEventListener('click', () => setCountdownExpanded(true));

        function formatPillText(info, now) {
            if (info.status === 'live') return `আজ ${info.phase.label}`;
            if (info.status === 'over') return 'Pujo is over — see you next year!';
            const parts = splitCountdown(info.target - now);
            return `${info.phase.label} · ${parts.days}d ${parts.hours}h ${parts.minutes}m`;
        }

        function renderPhase() {
            const now = new Date();
            const info = getPhaseStatus(DUGGA_PUJO_PHASES, now);

            if (info.status === 'upcoming') {
                phaseLabelEl.textContent = 'Counting down to';
                setLocalizedText(phaseNameEl, info.phase.label);
                phaseBlurbEl.textContent = ''; // phase.blurb is a live-day claim ("Today is মহালয়া ") — wrong to show while still counting down
                phaseBlurbEl.removeAttribute('lang');
                setLocalizedText(subheadingEl, `${info.phase.label} অপেক্ষা`);
                countdownGridEl.style.display = 'flex';

                const parts = splitCountdown(info.target - now);
                cdDays.textContent = parts.days;
                cdHours.textContent = String(parts.hours).padStart(2, '0');
                cdMinutes.textContent = String(parts.minutes).padStart(2, '0');
                cdSeconds.textContent = String(parts.seconds).padStart(2, '0');
            } else if (info.status === 'live') {
                phaseLabelEl.textContent = 'Happening now';
                setLocalizedText(phaseNameEl, info.phase.label);
                setLocalizedText(phaseBlurbEl, info.phase.blurb);
                setLocalizedText(subheadingEl, "It's " + info.phase.label + " 🪔");
                countdownGridEl.style.display = 'none';
            } else {
                phaseLabelEl.textContent = "That's a wrap";
                setLocalizedText(phaseNameEl, 'Pujo is over');
                setLocalizedText(phaseBlurbEl, 'See you next year!');
                setLocalizedText(subheadingEl, 'See you next year 🪔');
                countdownGridEl.style.display = 'none';
            }

            setupPhaseAudio(info.phase.key);
            refreshBackground(info);
            setLocalizedText(countdownPillEl, formatPillText(info, now));
        }

        renderPhase();
        setInterval(renderPhase, 1000);

        // ---- Expand / collapse ----
        const widget = document.getElementById('playerWidget');
        const icon = document.getElementById('playerIcon');
        icon.addEventListener('click', (e) => {
            e.stopPropagation();
            widget.classList.toggle('expanded');
        });
        document.addEventListener('click', (e) => {
            if (widget.classList.contains('expanded') && !widget.contains(e.target)) {
                widget.classList.remove('expanded');
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && widget.classList.contains('expanded')) {
                widget.classList.remove('expanded');
            }
        });

        // ---- Playback ----
        playBtn.addEventListener('click', () => {
            if (!currentPlaylist.length) return;
            if (!audioEl.src) {
                loadPlaylistTrack(0, true);
            } else if (audioEl.paused) {
                audioEl.play().catch(() => {});
            } else {
                audioEl.pause();
                if (userInteracted) fadeInTheme(); // explicit stop -> bring the ambient theme back
            }
        });
        prevBtn.addEventListener('click', () => {
            loadPlaylistTrack(currentTrackIndex - 1, !audioEl.paused);
        });
        nextBtn.addEventListener('click', () => {
            loadPlaylistTrack(currentTrackIndex + 1, !audioEl.paused);
        });
        audioEl.addEventListener('play', () => {
            playIcon.style.display = 'none';
            pauseIcon.style.display = '';
            playBtn.setAttribute('aria-label', 'Pause');
            icon.classList.add('playing');
            pauseTheme(); // any playlist playback (manual or auto-advance) ducks the theme
        });
        audioEl.addEventListener('pause', () => {
            playIcon.style.display = '';
            pauseIcon.style.display = 'none';
            playBtn.setAttribute('aria-label', 'Play');
            icon.classList.remove('playing');
        });
        audioEl.addEventListener('ended', () => {
            if (!currentPlaylist.length) return;
            const nextIndex = currentTrackIndex + 1;
            if (nextIndex < currentPlaylist.length) {
                loadPlaylistTrack(nextIndex, true);
            } else if (userInteracted) {
                fadeInTheme(); // reached the end of the playlist -> bring the ambient theme back
            }
        });
        audioEl.addEventListener('loadedmetadata', () => {
            durationLabel.textContent = formatTime(audioEl.duration);
        });
        audioEl.addEventListener('timeupdate', () => {
            if (!audioEl.duration || isSeeking) return;
            progressBar.value = (audioEl.currentTime / audioEl.duration) * 100;
            currentTimeLabel.textContent = formatTime(audioEl.currentTime);
        });
        progressBar.addEventListener('input', () => {
            isSeeking = true;
            if (audioEl.duration) {
                currentTimeLabel.textContent = formatTime((progressBar.value / 100) * audioEl.duration);
            }
        });
        progressBar.addEventListener('change', () => {
            if (audioEl.duration) {
                audioEl.currentTime = (progressBar.value / 100) * audioEl.duration;
            }
            isSeeking = false;
        });
    </script>
</body>
</html>

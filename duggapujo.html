<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dugga Pujo — Piyashhh's Space Station</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Same file as index.html's lyrics font — Hind Siliguri, covers Bangla + Latin */
        @font-face {
            font-family: 'MyLocalFont';
            src: url('customfont.ttf'); /* Update the extension if it is .woff2 or .otf */
            font-weight: normal;
            font-style: normal;
        }
        /* Anything marked lang="bn" picks this up automatically — English stays
           on the system stack below, untouched. e.g. <span lang="bn">দুর্গা পূজা</span> */
        [lang="bn"] {
            font-family: 'MyLocalFont', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Your photo as the full-bleed background. */
        /* If it isn't a .jpg, update this filename to match (e.g. duggapujobg.png) */
        .bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('duggapujobg.jpeg') no-repeat center center;
            background-size: cover;
            z-index: -3;
        }
        /* Dark scrim so white text stays readable over any photo */
        .bg-scrim {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(12, 5, 2, 0.45) 0%, rgba(12, 5, 2, 0.35) 45%, rgba(12, 5, 2, 0.65) 100%);
            z-index: -2;
        }

        /* Same particle engine as the homepage, recolored warm */
        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            image-rendering: pixelated;
        }

        .back-link {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top, 0px));
            left: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Low-opacity credit for whoever shot/made the background. */
        /* Fill BG_CREDIT.name in the script below — it's hidden until you do. */
        .bg-credit {
            position: fixed;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 20px;
            z-index: 5;
            font-size: 0.7rem;
            opacity: 0.35;
            letter-spacing: 0.2px;
            display: none;
        }

        .puja-header {
            text-align: center;
            padding: 0 24px;
            margin-bottom: 22px;
        }
        .puja-header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .puja-header p {
            margin-top: 6px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .countdown-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 200, 140, 0.25);
            border-radius: 24px;
            padding: 28px 24px;
            width: 88%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .phase-label {
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 205, 140, 0.9);
            margin-bottom: 4px;
        }
        .phase-name {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .countdown-unit { min-width: 54px; }
        .countdown-unit .num {
            font-size: 1.9rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .countdown-unit .unit {
            font-size: 0.62rem;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .phase-blurb {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.5;
        }

        /* ================================= */
        /* Music widget — same interaction   */
        /* pattern as the homepage player,   */
        /* one track per named day           */
        /* ================================= */
        .player-widget {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            right: 24px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .player-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 200, 140, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: background 0.25s ease, transform 0.2s ease;
        }
        .player-icon:active { transform: scale(0.93); }
        .player-icon svg {
            width: 22px; height: 22px;
            fill: none; stroke: #fff;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .player-icon .icon-close { display: none; }
        .player-widget.expanded .player-icon .icon-music { display: none; }
        .player-widget.expanded .player-icon .icon-close { display: block; }
        .player-icon.playing { animation: playPulse 1.8s ease-in-out infinite; }
        @keyframes playPulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 0 rgba(255,205,140,0.35); }
            50% { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 9px rgba(255,205,140,0); }
        }

        .player-panel {
            position: absolute;
            bottom: 68px;
            right: 0;
            width: min(280px, calc(100vw - 48px));
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 200, 140, 0.25);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            transform-origin: bottom right;
            transform: scale(0.85);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.2s ease;
        }
        .player-widget.expanded .player-panel {
            transform: scale(1); opacity: 1; pointer-events: auto;
        }

        .track-title {
            font-size: 0.96rem; font-weight: 600;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .track-artist {
            font-size: 0.76rem; color: rgba(255, 255, 255, 0.6);
            margin-bottom: 14px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .time-label { font-size: 0.68rem; color: rgba(255, 255, 255, 0.55); min-width: 30px; }
        .time-label.end { text-align: right; }

        input[type="range"].progress-bar {
            -webkit-appearance: none; appearance: none;
            flex: 1; height: 4px; border-radius: 2px;
            background: rgba(255, 255, 255, 0.22);
            cursor: pointer;
        }
        input[type="range"].progress-bar:disabled { opacity: 0.4; cursor: not-allowed; }
        input[type="range"].progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; cursor: pointer;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15);
        }
        input[type="range"].progress-bar::-moz-range-track {
            height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.22);
        }
        input[type="range"].progress-bar::-moz-range-thumb {
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; border: none;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15);
        }

        .controls-row { display: flex; align-items: center; justify-content: center; }
        .play-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 200, 140, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .play-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .play-btn:active:not(:disabled) { transform: scale(0.93); }
        .play-btn svg { width: 16px; height: 16px; }

        @media (prefers-reduced-motion: reduce) {
            .player-panel { transform: none; transition: opacity 0.15s ease; }
            .player-icon.playing { animation: none; }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="bg-scrim"></div>
    <canvas id="particleCanvas"></canvas>

    <a href="index.html" class="back-link">← Space Station</a>
    <div class="bg-credit" id="bgCredit"></div>

    <header class="puja-header">
        <h1>Dugga Pujo</h1>
        <p id="subheading">&nbsp;</p>
    </header>

    <div class="countdown-card">
        <div class="phase-label" id="phaseLabel">Counting down to</div>
        <div class="phase-name" id="phaseName">—</div>

        <div class="countdown-grid" id="countdownGrid">
            <div class="countdown-unit"><div class="num" id="cdDays">--</div><div class="unit">Days</div></div>
            <div class="countdown-unit"><div class="num" id="cdHours">--</div><div class="unit">Hrs</div></div>
            <div class="countdown-unit"><div class="num" id="cdMinutes">--</div><div class="unit">Min</div></div>
            <div class="countdown-unit"><div class="num" id="cdSeconds">--</div><div class="unit">Sec</div></div>
        </div>

        <div class="phase-blurb" id="phaseBlurb"></div>
    </div>

    <!-- Music widget, one track per named day -->
    <div class="player-widget" id="playerWidget">
        <div class="player-panel" id="playerPanel">
            <div class="track-title" id="trackTitle">—</div>
            <div class="track-artist" id="trackArtist">—</div>

            <div class="progress-row">
                <span class="time-label" id="currentTimeLabel">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" min="0" max="100" step="0.1" value="0" aria-label="Seek" disabled>
                <span class="time-label end" id="durationLabel">0:00</span>
            </div>

            <div class="controls-row">
                <button type="button" class="play-btn" id="playBtn" aria-label="Play" disabled>
                    <svg id="playIcon" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" fill="#fff" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
            </div>
        </div>

        <button type="button" class="player-icon" id="playerIcon" aria-label="Toggle music player">
            <svg class="icon-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            <svg class="icon-close" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <audio id="phaseAudio" preload="none"></audio>

    <script>
        // ===================================================================
        // Particle Engine — same system as the homepage, warm-toned
        // ===================================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1.5,
                speedX: (Math.random() - 0.5) * 0.8,
                speedY: (Math.random() - 0.5) * 0.8,
                alpha: Math.random() * 0.4 + 0.2,
                warm: Math.random() > 0.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.fillStyle = p.warm
                    ? `rgba(255, 196, 110, ${p.alpha})`
                    : `rgba(255, 140, 90, ${p.alpha})`;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.floor(p.size), Math.floor(p.size));
            });
            requestAnimationFrame(animate);
        }
        animate();

        // ===================================================================
        // Background photo credit — leave name blank to keep this hidden
        // ===================================================================
        const BG_CREDIT = {
            label: 'Photograph by', // change to 'Artwork by' if it's illustrated art
            name: ''                // fill in the photographer/artist's name or handle
        };
        if (BG_CREDIT.name) {
            const bgCreditEl = document.getElementById('bgCredit');
            bgCreditEl.textContent = `${BG_CREDIT.label} ${BG_CREDIT.name}`;
            bgCreditEl.style.display = 'block';
        }

        // ===================================================================
        // Dugga Pujo phases
        // ===================================================================
        // Dates are simplified to midnight-to-midnight IST calendar days
        // rather than exact tithi transition times (those shift by minutes
        // each year and need a Panchang lookup) — accurate enough for a
        // countdown, not a ritual timing tool. Update the dates every year;
        // Durga Puja follows the Hindu lunisolar calendar, so it lands on
        // different Gregorian dates annually.
        //
        // Add a track once you have one, e.g.:
        //   track: { src: 'mahalaya.flac', title: 'Mahalaya Dawn', artist: 'Your name' }
        const DUGGA_PUJO_PHASES = [
            { key: 'mahalaya', label: 'মহালয়া',       start: '2026-10-10T00:00:00+05:30', blurb: 'দেবীপক্ষের সূচনা', track: null },
            { key: 'shashthi', label: 'Shashthi',       start: '2026-10-17T00:00:00+05:30', blurb: 'Bodhon — the goddess is ceremonially awakened.', track: null },
            { key: 'saptami',  label: 'Saptami',        start: '2026-10-18T00:00:00+05:30', blurb: 'The second day of worship.', track: null },
            { key: 'ashtami',  label: 'Ashtami',        start: '2026-10-19T00:00:00+05:30', blurb: 'The most significant day — Sandhi Puja at twilight.', track: null },
            { key: 'navami',   label: 'Navami',         start: '2026-10-20T00:00:00+05:30', blurb: 'The final full day of worship.', track: null },
            { key: 'dashami',  label: 'Vijaya Dashami',  start: '2026-10-21T00:00:00+05:30', blurb: 'Visarjan — the goddess returns home, until next year.', track: null }
        ];

        function getPhaseStatus(phases, now) {
            for (let i = 0; i < phases.length; i++) {
                const start = new Date(phases[i].start);
                if (now < start) {
                    return { status: 'upcoming', phase: phases[i], target: start };
                }
                const windowEnd = new Date(start.getTime() + 24 * 60 * 60 * 1000);
                if (now < windowEnd) {
                    return { status: 'live', phase: phases[i] };
                }
            }
            return { status: 'over', phase: phases[phases.length - 1] };
        }

        function splitCountdown(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));
            return {
                days: Math.floor(totalSeconds / 86400),
                hours: Math.floor((totalSeconds % 86400) / 3600),
                minutes: Math.floor((totalSeconds % 3600) / 60),
                seconds: totalSeconds % 60
            };
        }

        // ---- Elements ----
        const subheadingEl = document.getElementById('subheading');
        const phaseLabelEl = document.getElementById('phaseLabel');
        const phaseNameEl = document.getElementById('phaseName');
        const phaseBlurbEl = document.getElementById('phaseBlurb');
        const countdownGridEl = document.getElementById('countdownGrid');
        const cdDays = document.getElementById('cdDays');
        const cdHours = document.getElementById('cdHours');
        const cdMinutes = document.getElementById('cdMinutes');
        const cdSeconds = document.getElementById('cdSeconds');

        const audioEl = document.getElementById('phaseAudio');
        const trackTitleEl = document.getElementById('trackTitle');
        const trackArtistEl = document.getElementById('trackArtist');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeLabel = document.getElementById('currentTimeLabel');
        const durationLabel = document.getElementById('durationLabel');

        let isSeeking = false;

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateMusicPanel(info) {
            const track = info.phase && info.phase.track;
            if (track) {
                trackTitleEl.textContent = track.title || info.phase.label;
                trackArtistEl.textContent = track.artist || '';
                if (audioEl.dataset.loadedSrc !== track.src) {
                    audioEl.pause();
                    audioEl.src = track.src;
                    audioEl.dataset.loadedSrc = track.src;
                }
                playBtn.disabled = false;
                progressBar.disabled = false;
            } else {
                trackTitleEl.textContent = info.phase ? info.phase.label : 'Dugga Pujo';
                trackArtistEl.textContent = 'No track set yet';
                audioEl.pause();
                audioEl.removeAttribute('src');
                delete audioEl.dataset.loadedSrc;
                playBtn.disabled = true;
                progressBar.disabled = true;
                progressBar.value = 0;
                currentTimeLabel.textContent = '0:00';
                durationLabel.textContent = '0:00';
            }
        }

        // Bengali script sits in one contiguous Unicode block (U+0980–U+09FF),
        // so this catches any Bangla text regardless of which phase it's in —
        // no need to hand-flag each phase as English or Bangla.
        function setLocalizedText(el, text) {
            el.textContent = text;
            if (/[\u0980-\u09FF]/.test(text)) {
                el.setAttribute('lang', 'bn');
            } else {
                el.removeAttribute('lang');
            }
        }

        function renderPhase() {
            const now = new Date();
            const info = getPhaseStatus(DUGGA_PUJO_PHASES, now);

            if (info.status === 'upcoming') {
                phaseLabelEl.textContent = 'Counting down to';
                setLocalizedText(phaseNameEl, info.phase.label);
                setLocalizedText(phaseBlurbEl, info.phase.blurb);
                setLocalizedText(subheadingEl, `${info.phase.label} is on its way`);
                countdownGridEl.style.display = 'flex';

                const parts = splitCountdown(info.target - now);
                cdDays.textContent = parts.days;
                cdHours.textContent = String(parts.hours).padStart(2, '0');
                cdMinutes.textContent = String(parts.minutes).padStart(2, '0');
                cdSeconds.textContent = String(parts.seconds).padStart(2, '0');
            } else if (info.status === 'live') {
                phaseLabelEl.textContent = 'Happening now';
                setLocalizedText(phaseNameEl, info.phase.label);
                setLocalizedText(phaseBlurbEl, info.phase.blurb);
                setLocalizedText(subheadingEl, "It's " + info.phase.label + " 🪔");
                countdownGridEl.style.display = 'none';
            } else {
                phaseLabelEl.textContent = "That's a wrap";
                setLocalizedText(phaseNameEl, 'Dugga Pujo');
                setLocalizedText(phaseBlurbEl, "Until next year — update DUGGA_PUJO_PHASES with next year's dates once they're announced.");
                setLocalizedText(subheadingEl, 'See you next year 🪔');
                countdownGridEl.style.display = 'none';
            }

            updateMusicPanel(info);
        }

        renderPhase();
        setInterval(renderPhase, 1000);

        // ---- Expand / collapse ----
        const widget = document.getElementById('playerWidget');
        const icon = document.getElementById('playerIcon');
        icon.addEventListener('click', (e) => {
            e.stopPropagation();
            widget.classList.toggle('expanded');
        });
        document.addEventListener('click', (e) => {
            if (widget.classList.contains('expanded') && !widget.contains(e.target)) {
                widget.classList.remove('expanded');
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && widget.classList.contains('expanded')) {
                widget.classList.remove('expanded');
            }
        });

        // ---- Playback ----
        playBtn.addEventListener('click', () => {
            if (!audioEl.src) return;
            if (audioEl.paused) audioEl.play().catch(() => {});
            else audioEl.pause();
        });
        audioEl.addEventListener('play', () => {
            playIcon.style.display = 'none';
            pauseIcon.style.display = '';
            playBtn.setAttribute('aria-label', 'Pause');
            icon.classList.add('playing');
        });
        audioEl.addEventListener('pause', () => {
            playIcon.style.display = '';
            pauseIcon.style.display = 'none';
            playBtn.setAttribute('aria-label', 'Play');
            icon.classList.remove('playing');
        });
        audioEl.addEventListener('loadedmetadata', () => {
            durationLabel.textContent = formatTime(audioEl.duration);
        });
        audioEl.addEventListener('timeupdate', () => {
            if (!audioEl.duration || isSeeking) return;
            progressBar.value = (audioEl.currentTime / audioEl.duration) * 100;
            currentTimeLabel.textContent = formatTime(audioEl.currentTime);
        });
        progressBar.addEventListener('input', () => {
            isSeeking = true;
            if (audioEl.duration) {
                currentTimeLabel.textContent = formatTime((progressBar.value / 100) * audioEl.duration);
            }
        });
        progressBar.addEventListener('change', () => {
            if (audioEl.duration) {
                audioEl.currentTime = (progressBar.value / 100) * audioEl.duration;
            }
            isSeeking = false;
        });
    </script>
</body>
</html>

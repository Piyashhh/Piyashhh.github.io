<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>আগমনী — Piyashhh's Space Station</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Same file as index.html's lyrics font — Hind Siliguri, covers Bangla + Latin */
        @font-face {
            font-family: 'MyLocalFont';
            src: url('customfont.ttf'); /* Update the extension if it is .woff2 or .otf */
            font-weight: normal;
            font-style: normal;
        }
        /* Anything marked lang="bn" picks this up automatically — English stays
           on the system stack below, untouched. e.g. <span lang="bn">দুর্গা পূজা</span> */
        [lang="bn"] {
            font-family: 'MyLocalFont', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Background photo — swapped dynamically by JS based on the current
           Pujo phase and time of day in Kolkata. This is just the fallback
           shown before that first runs. */
        .bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg-day.jpg') no-repeat center center;
            background-size: cover;
            z-index: -2;
            transition: opacity 0.4s ease;
        }

        /* Same particle engine as the homepage, recolored warm */
        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            image-rendering: pixelated;
        }

        .back-link {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top, 0px));
            left: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Low-opacity credit for whoever shot/made the background. */
        /* Fill BG_CREDIT.name in the script below — it's hidden until you do. */
        .bg-credit {
            position: fixed;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 20px;
            z-index: 5;
            font-size: 0.7rem;
            opacity: 0.35;
            letter-spacing: 0.2px;
            display: none;
        }

        .puja-header {
            text-align: center;
            padding: 0 24px;
            margin-top: 10vh;
        }
        .puja-header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .puja-header p {
            margin-top: 6px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .countdown-card {
            position: fixed;
            bottom: calc(100px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 200, 140, 0.25);
            border-radius: 24px;
            padding: 28px 24px;
            width: 88%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            z-index: 15;
        }
        .card-collapse-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            padding: 0;
        }
        .card-collapse-btn svg {
            width: 14px; height: 14px;
            fill: none; stroke: #fff; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* Collapsed state — a pill that fills the bar between the map icon
           on the left and the music icon on the right, sitting on the same
           row as both. */
        .countdown-pill {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            left: calc(24px + 56px + 12px); /* map icon's own 24px margin + its 56px icon + a 12px gap */
            right: calc(24px + 56px + 12px); /* music widget's own 24px margin + its 56px icon + a 12px gap */
            height: 56px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 200, 140, 0.25);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            z-index: 20;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: transform 0.2s ease;
        }
        .countdown-pill:active { transform: scale(0.98); }
        .phase-label {
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 205, 140, 0.9);
            margin-bottom: 4px;
        }
        .phase-name {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .countdown-unit { min-width: 46px; }
        .countdown-unit .num {
            font-size: 1.9rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .countdown-unit .unit {
            font-size: 0.62rem;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .phase-blurb {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.5;
        }

        /* ================================= */
        /* Map button — mirrors the music    */
        /* widget's icon on the opposite     */
        /* side of the bottom bar            */
        /* ================================= */
        .map-icon {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            left: 24px;
            z-index: 20;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 200, 140, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: background 0.25s ease, transform 0.2s ease;
        }
        .map-icon:active { transform: scale(0.93); }
        .map-icon svg {
            width: 22px; height: 22px;
            fill: none; stroke: #fff;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        /* ================================= */
        /* Music widget — same interaction   */
        /* pattern as the homepage player,   */
        /* one track per named day           */
        /* ================================= */
        .player-widget {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            right: 24px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .player-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 200, 140, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: background 0.25s ease, transform 0.2s ease;
        }
        .player-icon:active { transform: scale(0.93); }
        .player-icon svg {
            width: 22px; height: 22px;
            fill: none; stroke: #fff;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .player-icon .icon-close { display: none; }
        .player-widget.expanded .player-icon .icon-music { display: none; }
        .player-widget.expanded .player-icon .icon-close { display: block; }
        .player-icon.playing { animation: playPulse 1.8s ease-in-out infinite; }
        @keyframes playPulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 0 rgba(255,205,140,0.35); }
            50% { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 9px rgba(255,205,140,0); }
        }

        /* Wrapper for everything that appears when the player expands —
           tabs + panel stack in normal flow here, so the tabs sit "above"
           the panel automatically regardless of the panel's actual height. */
        .player-expanded-content {
            position: absolute;
            bottom: 68px;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            transform-origin: bottom right;
            transform: scale(0.85);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.2s ease;
        }
        .player-widget.expanded .player-expanded-content {
            transform: scale(1); opacity: 1; pointer-events: auto;
        }

        /* Playlist tabs + view-playlist button — combined width matches the
           player panel exactly, so the whole stack reads as one unit. */
        .playlist-tabs {
            display: flex;
            gap: 6px;
            width: min(280px, calc(100vw - 48px));
        }
        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 200, 140, 0.3);
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.68rem;
            font-weight: 600;
            padding: 7px 4px;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }
        .tab-btn.active {
            background: rgba(255, 200, 140, 0.3);
            color: #fff;
            border-color: rgba(255, 200, 140, 0.5);
        }
        .view-playlist-btn {
            flex: 0 0 32px;
            width: 32px; height: 32px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 200, 140, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }
        .view-playlist-btn svg {
            width: 14px; height: 14px;
            fill: none; stroke: #fff; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* Track list — toggled open by the view-playlist button. Full panel
           background (not just a divider line) so it's consistent regardless
           of which playlist is open or whether anything's currently playing. */
        .track-list {
            display: none;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
        }
        .track-list.open { display: block; }
        .track-list-item {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.78rem;
            padding: 7px 4px;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .track-list-item.current {
            color: #fff;
            font-weight: 600;
            background: rgba(255, 200, 140, 0.15);
        }
        .track-list-empty {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.5);
            padding: 4px;
        }

        .player-panel {
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 200, 140, 0.25);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            width: min(280px, calc(100vw - 48px));
        }

        .track-title {
            font-size: 0.96rem; font-weight: 600;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .track-artist {
            font-size: 0.76rem; color: rgba(255, 255, 255, 0.6);
            margin-bottom: 14px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .time-label { font-size: 0.68rem; color: rgba(255, 255, 255, 0.55); min-width: 30px; }
        .time-label.end { text-align: right; }

        input[type="range"].progress-bar {
            -webkit-appearance: none; appearance: none;
            flex: 1; height: 4px; border-radius: 2px;
            background: rgba(255, 255, 255, 0.22);
            cursor: pointer;
        }
        input[type="range"].progress-bar:disabled { opacity: 0.4; cursor: not-allowed; }
        input[type="range"].progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; cursor: pointer;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15);
        }
        input[type="range"].progress-bar::-moz-range-track {
            height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.22);
        }
        input[type="range"].progress-bar::-moz-range-thumb {
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; border: none;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15);
        }

        .controls-row { display: flex; align-items: center; justify-content: center; }
        .play-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 200, 140, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .play-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .play-btn:active:not(:disabled) { transform: scale(0.93); }
        .play-btn svg { width: 16px; height: 16px; }

        @media (prefers-reduced-motion: reduce) {
            .player-expanded-content { transform: none; transition: opacity 0.15s ease; }
            .player-icon.playing { animation: none; }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <canvas id="particleCanvas"></canvas>

    <a href="index.html" class="back-link">← Space Station</a>
    <div class="bg-credit" id="bgCredit"></div>

    <header class="puja-header">
        <h1>আগমনী</h1>
        <p id="subheading">&nbsp;</p>
    </header>

    <div class="countdown-card" id="countdownCard">
        <button type="button" class="card-collapse-btn" id="collapseBtn" aria-label="Collapse countdown">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="phase-label" id="phaseLabel">Counting down to</div>
        <div class="phase-name" id="phaseName">—</div>

        <div class="countdown-grid" id="countdownGrid">
            <div class="countdown-unit"><div class="num" id="cdDays">--</div><div class="unit">Days</div></div>
            <div class="countdown-unit"><div class="num" id="cdHours">--</div><div class="unit">Hrs</div></div>
            <div class="countdown-unit"><div class="num" id="cdMinutes">--</div><div class="unit">Min</div></div>
            <div class="countdown-unit"><div class="num" id="cdSeconds">--</div><div class="unit">Sec</div></div>
        </div>

        <div class="phase-blurb" id="phaseBlurb"></div>
    </div>

    <button type="button" class="countdown-pill" id="countdownPill" aria-label="Expand countdown"></button>

    <!-- Map button — mirrors the music-player button on the opposite side -->
    <button type="button" class="map-icon" id="mapIcon" aria-label="Open map">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
    </button>

    <!-- Music widget — three browsable playlists, no auto-playing theme -->
    <div class="player-widget" id="playerWidget">
        <div class="player-expanded-content">
            <div class="playlist-tabs" id="playlistTabs">
                <button type="button" class="tab-btn" data-bucket="agomoni">আগমনী</button>
                <button type="button" class="tab-btn" data-bucket="mahalaya">মহালয়া</button>
                <button type="button" class="tab-btn" data-bucket="pujo">পুজো</button>
                <button type="button" class="view-playlist-btn" id="viewPlaylistBtn" aria-label="View playlist">
                    <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
                </button>
            </div>

            <div class="player-panel" id="playerPanel">
                <div class="track-title" id="trackTitle">—</div>
                <div class="track-artist" id="trackArtist">—</div>

                <div class="progress-row">
                    <span class="time-label" id="currentTimeLabel">0:00</span>
                    <input type="range" class="progress-bar" id="progressBar" min="0" max="100" step="0.1" value="0" aria-label="Seek" disabled>
                    <span class="time-label end" id="durationLabel">0:00</span>
                </div>

                <div class="controls-row">
                    <button type="button" class="play-btn" id="prevBtn" aria-label="Previous track" disabled style="margin-right: 12px; width: 36px; height: 36px;">
                        <svg viewBox="0 0 24 24" fill="#fff"><path d="M18 6l-8.5 6 8.5 6V6zM8 6v12h-2V6h2z"/></svg>
                    </button>
                    <button type="button" class="play-btn" id="playBtn" aria-label="Play" disabled>
                        <svg id="playIcon" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" fill="#fff" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                    </button>
                    <button type="button" class="play-btn" id="nextBtn" aria-label="Next track" disabled style="margin-left: 12px; width: 36px; height: 36px;">
                        <svg viewBox="0 0 24 24" fill="#fff"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>

                <div class="track-list" id="trackList"></div>
            </div>
        </div>

        <button type="button" class="player-icon" id="playerIcon" aria-label="Toggle music player">
            <svg class="icon-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            <svg class="icon-close" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <!-- Playlist track playback -->
    <audio id="phaseAudio" preload="none"></audio>

    <script>
        // ===================================================================
        // Particle Engine — same system as the homepage, warm-toned
        // ===================================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1.5,
                speedX: (Math.random() - 0.5) * 0.8,
                speedY: (Math.random() - 0.5) * 0.8,
                alpha: Math.random() * 0.4 + 0.2,
                warm: Math.random() > 0.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.fillStyle = p.warm
                    ? `rgba(255, 196, 110, ${p.alpha})`
                    : `rgba(255, 140, 90, ${p.alpha})`;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.floor(p.size), Math.floor(p.size));
            });
            requestAnimationFrame(animate);
        }
        animate();

        // ===================================================================
        // Background photo credit — leave name blank to keep this hidden
        // ===================================================================
        const BG_CREDIT = {
            label: 'Photograph by', // change to 'Artwork by' if it's illustrated art
            name: ''                // fill in the photographer/artist's name or handle
        };
        if (BG_CREDIT.name) {
            const bgCreditEl = document.getElementById('bgCredit');
            bgCreditEl.textContent = `${BG_CREDIT.label} ${BG_CREDIT.name}`;
            bgCreditEl.style.display = 'block';
        }

        // ===================================================================
        // Map button — opens an external map link in a new tab.
        // Swap in the real URL when it's ready.
        // ===================================================================
        const MAP_URL = '#';
        const mapIcon = document.getElementById('mapIcon');
        mapIcon.addEventListener('click', () => {
            window.open(MAP_URL, '_blank', 'noopener,noreferrer');
        });

        // ===================================================================
        // Dugga Pujo phases
        // ===================================================================
        // Dates are simplified to midnight-to-midnight IST calendar days
        // rather than exact tithi transition times (those shift by hours
        // and need a Panchang lookup) — accurate enough for a countdown,
        // not a ritual timing tool. Cross-checked against several
        // Kolkata-specific sources; Saptami genuinely spans two calendar
        // days this year (a "stretched" tithi), which is why it isn't
        // exactly 24h like the others — the window-chaining logic below
        // handles that automatically since Saptami's window just runs
        // until Ashtami's start.
        //
        // Update every year — Durga Puja follows the lunisolar calendar,
        // so these dates shift annually.
        const DUGGA_PUJO_PHASES = [
            { key: 'mahalaya',  label: 'মহালয়া',       start: '2026-10-10T00:00:00+05:30', blurb: 'Today is মহালয়া' },
            { key: 'pratipada', label: 'Pratipada',     start: '2026-10-11T00:00:00+05:30', blurb: 'Day 1 of Devi Paksha.' },
            { key: 'dwitiya',   label: 'Dwitiya',       start: '2026-10-12T00:00:00+05:30', blurb: 'Day 2 of Devi Paksha.' },
            { key: 'tritiya',   label: 'Tritiya',       start: '2026-10-13T00:00:00+05:30', blurb: 'Day 3 of Devi Paksha.' },
            { key: 'chaturthi', label: 'Chaturthi',     start: '2026-10-14T00:00:00+05:30', blurb: 'Day 4 of Devi Paksha.' },
            { key: 'panchami',  label: 'Maha Panchami', start: '2026-10-15T00:00:00+05:30', blurb: 'Day 5 of Devi Paksha.' },
            { key: 'shashthi',  label: 'Maha Shashthi', start: '2026-10-16T00:00:00+05:30', blurb: 'Bodhon — the goddess is ceremonially awakened.' },
            { key: 'saptami',   label: 'Maha Saptami',  start: '2026-10-17T00:00:00+05:30', blurb: 'Nabapatrika Snan — the ceremonial bathing of nine sacred plants.' },
            { key: 'ashtami',   label: 'Maha Ashtami',  start: '2026-10-19T00:00:00+05:30', blurb: 'The most significant day — Sandhi Puja at twilight.' },
            { key: 'navami',    label: 'Maha Navami',   start: '2026-10-20T00:00:00+05:30', blurb: 'The final full day of worship.' },
            { key: 'dashami',   label: 'Vijaya Dashami', start: '2026-10-21T00:00:00+05:30', end: '2026-10-22T00:00:00+05:30', blurb: 'Visarjan — the goddess returns home, until next year.' }
        ];

        function getPhaseStatus(phases, now) {
            for (let i = 0; i < phases.length; i++) {
                const start = new Date(phases[i].start);
                if (now < start) {
                    return { status: 'upcoming', phase: phases[i], target: start };
                }
                const windowEnd = phases[i].end
                    ? new Date(phases[i].end)
                    : (i + 1 < phases.length ? new Date(phases[i + 1].start) : null);
                if (!windowEnd || now < windowEnd) {
                    return { status: 'live', phase: phases[i] };
                }
            }
            return { status: 'over', phase: phases[phases.length - 1] };
        }

        function splitCountdown(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));
            return {
                days: Math.floor(totalSeconds / 86400),
                hours: Math.floor((totalSeconds % 86400) / 3600),
                minutes: Math.floor((totalSeconds % 3600) / 60),
                seconds: totalSeconds % 60
            };
        }

        // ---- Elements ----
        const subheadingEl = document.getElementById('subheading');
        const phaseLabelEl = document.getElementById('phaseLabel');
        const phaseNameEl = document.getElementById('phaseName');
        const phaseBlurbEl = document.getElementById('phaseBlurb');
        const countdownGridEl = document.getElementById('countdownGrid');
        const cdDays = document.getElementById('cdDays');
        const cdHours = document.getElementById('cdHours');
        const cdMinutes = document.getElementById('cdMinutes');
        const cdSeconds = document.getElementById('cdSeconds');

        const audioEl = document.getElementById('phaseAudio'); // the playlist you browse manually
        const trackTitleEl = document.getElementById('trackTitle');
        const trackArtistEl = document.getElementById('trackArtist');
        const viewPlaylistBtn = document.getElementById('viewPlaylistBtn');
        const trackListEl = document.getElementById('trackList');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeLabel = document.getElementById('currentTimeLabel');
        const durationLabel = document.getElementById('durationLabel');

        let isSeeking = false;

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // MP3's ID3v2 tagging is genuinely reliable and near-universal — every
        // common encoder/tagger writes it — so it's worth reading properly
        // rather than falling back to filenames. Handles v2.3 and v2.4 (the
        // two versions virtually everything in the wild uses); falls back to
        // the filename if a file has no tag or something unexpected happens.
        async function readId3Tags(url) {
            try {
                const res = await fetch(url, { headers: { Range: 'bytes=0-524287' } });
                if (!res.ok) throw new Error('fetch failed');
                const buf = await res.arrayBuffer();
                const view = new DataView(buf);

                if (view.getUint8(0) !== 0x49 || view.getUint8(1) !== 0x44 || view.getUint8(2) !== 0x33) {
                    throw new Error('no ID3v2 tag'); // "ID3"
                }
                const majorVersion = view.getUint8(3);
                const flags = view.getUint8(5);
                const hasExtendedHeader = (flags & 0x40) !== 0;
                // Tag size is "synchsafe": 7 usable bits per byte, MSB always 0
                const tagSize = (view.getUint8(6) << 21) | (view.getUint8(7) << 14) | (view.getUint8(8) << 7) | view.getUint8(9);
                const tagEnd = Math.min(10 + tagSize, buf.byteLength);

                let offset = 10;
                if (hasExtendedHeader) {
                    const extSize = majorVersion >= 4
                        ? (view.getUint8(offset) << 21) | (view.getUint8(offset + 1) << 14) | (view.getUint8(offset + 2) << 7) | view.getUint8(offset + 3)
                        : view.getUint32(offset, false);
                    offset += majorVersion >= 4 ? extSize : extSize + 4;
                }

                const tags = {};
                while (offset + 10 <= tagEnd) {
                    const frameId = String.fromCharCode(view.getUint8(offset), view.getUint8(offset + 1), view.getUint8(offset + 2), view.getUint8(offset + 3));
                    if (frameId === '\u0000\u0000\u0000\u0000') break; // padding reached

                    // Frame size is synchsafe in v2.4, a plain big-endian int in v2.3
                    const frameSize = majorVersion >= 4
                        ? (view.getUint8(offset + 4) << 21) | (view.getUint8(offset + 5) << 14) | (view.getUint8(offset + 6) << 7) | view.getUint8(offset + 7)
                        : view.getUint32(offset + 4, false);
                    const contentStart = offset + 10;

                    if ((frameId === 'TIT2' || frameId === 'TPE1') && frameSize > 0 && contentStart + frameSize <= buf.byteLength) {
                        const encodingByte = view.getUint8(contentStart);
                        const textBytes = new Uint8Array(buf, contentStart + 1, frameSize - 1);
                        let text = '';
                        try {
                            if (encodingByte === 0x00) {
                                text = new TextDecoder('windows-1252').decode(textBytes);
                            } else if (encodingByte === 0x01) {
                                const little = textBytes.length < 2 || textBytes[0] === 0xFF;
                                const hasBOM = textBytes.length >= 2 && ((textBytes[0] === 0xFF && textBytes[1] === 0xFE) || (textBytes[0] === 0xFE && textBytes[1] === 0xFF));
                                text = new TextDecoder(little ? 'utf-16le' : 'utf-16be').decode(hasBOM ? textBytes.slice(2) : textBytes);
                            } else if (encodingByte === 0x02) {
                                text = new TextDecoder('utf-16be').decode(textBytes);
                            } else {
                                text = new TextDecoder('utf-8').decode(textBytes);
                            }
                        } catch (e) { text = ''; }
                        text = text.replace(/\u0000+$/, '').trim();
                        if (text) {
                            if (frameId === 'TIT2') tags.title = text;
                            if (frameId === 'TPE1') tags.artist = text;
                        }
                    }
                    offset = contentStart + frameSize;
                }
                return { title: tags.title || null, artist: tags.artist || null };
            } catch (err) {
                console.warn('ID3 metadata read failed:', url, err.message);
                return { title: null, artist: null };
            }
        }

        // Last-resort fallback when a file has no readable tag at all.
        function titleFromFilename(url) {
            const base = url.split('/').pop().replace(/\.[^.]+$/, '');
            return base.replace(/[-_]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
        }

        // ===================================================================
        // Playlists
        // ===================================================================
        // Three named playlists. File convention:
        //   agomoni1.mp3 .. agomoni10.mp3   — pre-Mahalaya countdown
        //   mahalaya1.mp3 .. mahalaya10.mp3 — Mahalaya day itself
        //   pujo1.mp3 .. pujo10.mp3         — every day after Mahalaya through Dashami
        // Whichever numbered files actually exist get used.
        const PLAYLIST_BUCKETS = ['agomoni', 'mahalaya', 'pujo'];

        function probeFileExists(url) {
            return fetch(url, { method: 'HEAD' }).then(res => res.ok).catch(() => false);
        }

        async function buildBucketPlaylist(bucket) {
            const candidateUrls = [];
            for (let i = 1; i <= 10; i++) candidateUrls.push(`${bucket}${i}.mp3`);
            const foundUrls = (await Promise.all(candidateUrls.map(async (url) => (await probeFileExists(url)) ? url : null))).filter(Boolean);
            return Promise.all(foundUrls.map(async (src) => {
                const meta = await readId3Tags(src);
                return { src, title: meta.title || titleFromFilename(src), artist: meta.artist || '' };
            }));
        }

        // Which playlist the current moment points to by default — the user
        // can still manually flip to a different tab.
        function getDefaultBucket(info) {
            if (info.status === 'upcoming') return 'agomoni';
            if (info.status === 'live' && info.phase.key === 'mahalaya') return 'mahalaya';
            if (info.status === 'live') return 'pujo';
            return null; // 'over' — nothing plays
        }

        // 'viewed' (what the tabs/track-list show) and 'playing' (what's
        // actually loaded in the player) are deliberately separate — browsing
        // a different tab must never touch what's currently playing.
        let viewedBucket = null;
        let playingBucket = null;
        let playingIndex = -1;
        let hasEverPlayed = false;
        let userPickedBucket = false; // once true, stop auto-switching tabs on phase change
        let bucketCache = {}; // bucket name -> resolved [{src,title,artist}], so re-visiting a tab doesn't re-probe

        function setActiveTab(bucket) {
            document.querySelectorAll('.tab-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.bucket === bucket);
            });
        }

        async function getBucketTracks(bucket) {
            if (bucketCache[bucket]) return bucketCache[bucket];
            const tracks = await buildBucketPlaylist(bucket);
            bucketCache[bucket] = tracks;
            return tracks;
        }

        function renderTrackList(tracks) {
            trackListEl.innerHTML = '';
            if (!tracks.length) {
                const empty = document.createElement('div');
                empty.className = 'track-list-empty';
                empty.textContent = 'No tracks in this playlist yet.';
                trackListEl.appendChild(empty);
                return;
            }
            tracks.forEach((track, i) => {
                const isCurrent = viewedBucket === playingBucket && i === playingIndex;
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'track-list-item' + (isCurrent ? ' current' : '');
                item.textContent = track.artist ? `${track.title} — ${track.artist}` : track.title;
                item.addEventListener('click', () => playFromBucket(viewedBucket, i, true));
                trackListEl.appendChild(item);
            });
        }

        // Changes which playlist is BROWSABLE (tab highlight + track list).
        // Never touches audioEl — purely a viewing concern.
        async function viewBucket(bucket) {
            viewedBucket = bucket;
            setActiveTab(bucket);
            const tracks = await getBucketTracks(bucket);
            if (viewedBucket === bucket) renderTrackList(tracks); // guard against a stale response if tabbed again quickly
            return tracks;
        }

        // The ONLY function allowed to touch audioEl / actual playback.
        function playFromBucket(bucket, index, autoPlay) {
            const tracks = bucketCache[bucket] || [];
            if (!tracks.length) return;
            playingBucket = bucket;
            playingIndex = ((index % tracks.length) + tracks.length) % tracks.length;
            const track = tracks[playingIndex];

            setLocalizedText(trackTitleEl, track.title);
            setLocalizedText(trackArtistEl, track.artist || '\u00A0');

            audioEl.src = track.src;
            if (autoPlay) audioEl.play().catch(() => {});

            playBtn.disabled = false;
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            progressBar.disabled = false;

            if (viewedBucket === bucket) renderTrackList(tracks);
        }

        document.querySelectorAll('.tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                userPickedBucket = true;
                viewBucket(btn.dataset.bucket);
            });
        });

        viewPlaylistBtn.addEventListener('click', () => {
            trackListEl.classList.toggle('open');
        });

        // Called every render tick; cheap no-op once the default bucket has
        // been picked and something has been loaded — the guards below make
        // sure this never fights the user for control once they've engaged.
        async function updateAudioForPhase(info) {
            if (userPickedBucket) return;
            const def = getDefaultBucket(info);
            if (!def || def === viewedBucket) return;
            const tracks = await viewBucket(def);
            if (!hasEverPlayed && !playingBucket && tracks.length) {
                playFromBucket(def, 0, false); // load immediately so it's ready the instant the panel opens — don't wait for Play
            }
        }

        function setLocalizedText(el, text) {
            el.textContent = text;
            if (/[\u0980-\u09FF]/.test(text)) {
                el.setAttribute('lang', 'bn');
            } else {
                el.removeAttribute('lang');
            }
        }

        function autoTagBanglaText(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                acceptNode(node) {
                    const tag = node.parentElement && node.parentElement.tagName;
                    if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
                    return NodeFilter.FILTER_ACCEPT;
                }
            });
            let node;
            while ((node = walker.nextNode())) {
                if (node.parentElement && /[\u0980-\u09FF]/.test(node.textContent)) {
                    node.parentElement.setAttribute('lang', 'bn');
                }
            }
        }
        autoTagBanglaText(document.body);

        function getKolkataHour() {
            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Kolkata', hour: 'numeric', hour12: false
            }).formatToParts(new Date());
            const hourPart = parts.find(p => p.type === 'hour').value;
            return parseInt(hourPart, 10) % 24;
        }

        function getTimeOfDay() {
            const h = getKolkataHour();
            if (h >= 5 && h < 11) return 'morning';
            if (h >= 11 && h < 17) return 'day';
            return 'night';
        }

        function getBackgroundCandidates(info, timeOfDay) {
            if (info.status === 'live') {
                return [
                    `bg-${info.phase.key}-${timeOfDay}.jpg`,
                    `bg-pujo-${timeOfDay}.jpg`,
                    `bg-${timeOfDay}.jpg`
                ];
            }
            return [`bg-${timeOfDay}.jpg`];
        }

        function tryLoadImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        async function pickFirstAvailableImage(candidates) {
            for (const url of candidates) {
                const result = await tryLoadImage(url);
                if (result) return result;
            }
            return null;
        }

        function applyBackgroundImage(url) {
            const bgEl = document.querySelector('.bg-container');
            if (bgEl.dataset.currentBg === url) return;
            bgEl.style.opacity = '0';
            setTimeout(() => {
                bgEl.style.backgroundImage = `url('${url}')`;
                bgEl.dataset.currentBg = url;
                bgEl.style.opacity = '1';
            }, 400);
        }

        let lastBgKey = null;
        async function refreshBackground(info) {
            const timeOfDay = getTimeOfDay();
            const seasonKey = info.status === 'live' ? info.phase.key : 'default';
            const bgKey = `${seasonKey}:${timeOfDay}`;
            if (bgKey === lastBgKey) return;
            lastBgKey = bgKey;

            const winner = await pickFirstAvailableImage(getBackgroundCandidates(info, timeOfDay));
            if (winner) {
                applyBackgroundImage(winner);
            } else {
                const bgEl = document.querySelector('.bg-container');
                if (!bgEl.dataset.currentBg) bgEl.style.background = '#1a1410';
            }
        }

        const countdownCardEl = document.getElementById('countdownCard');
        const countdownPillEl = document.getElementById('countdownPill');
        const collapseBtn = document.getElementById('collapseBtn');
        let countdownExpanded = true;

        function setCountdownExpanded(expanded) {
            countdownExpanded = expanded;
            countdownCardEl.style.display = expanded ? 'block' : 'none';
            countdownPillEl.style.display = expanded ? 'none' : 'flex';
        }
        collapseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setCountdownExpanded(false);
        });
        countdownPillEl.addEventListener('click', () => {
            widget.classList.remove('expanded'); // only one panel open at a time
            setCountdownExpanded(true);
        });

        function formatPillText(info, now) {
            if (info.status === 'live') return `আজ ${info.phase.label}`;
            if (info.status === 'over') return 'Pujo is over — see you next year!';
            const parts = splitCountdown(info.target - now);
            return `${info.phase.label} · ${parts.days}d ${parts.hours}h ${parts.minutes}m`;
        }

        function renderPhase() {
            const now = new Date();
            const info = getPhaseStatus(DUGGA_PUJO_PHASES, now);

            if (info.status === 'upcoming') {
                phaseLabelEl.textContent = 'Counting down to';
                setLocalizedText(phaseNameEl, info.phase.label);
                phaseBlurbEl.textContent = '';
                phaseBlurbEl.removeAttribute('lang');
                setLocalizedText(subheadingEl, `${info.phase.label} অপেক্ষা`);
                countdownGridEl.style.display = 'flex';

                const parts = splitCountdown(info.target - now);
                cdDays.textContent = parts.days;
                cdHours.textContent = String(parts.hours).padStart(2, '0');
                cdMinutes.textContent = String(parts.minutes).padStart(2, '0');
                cdSeconds.textContent = String(parts.seconds).padStart(2, '0');
            } else if (info.status === 'live') {
                phaseLabelEl.textContent = 'Happening now';
                setLocalizedText(phaseNameEl, info.phase.label);
                setLocalizedText(phaseBlurbEl, info.phase.blurb);
                setLocalizedText(subheadingEl, "It's " + info.phase.label + " 🪔");
                countdownGridEl.style.display = 'none';
            } else {
                phaseLabelEl.textContent = "That's a wrap";
                setLocalizedText(phaseNameEl, 'Pujo is over');
                setLocalizedText(phaseBlurbEl, 'See you next year!');
                setLocalizedText(subheadingEl, 'See you next year 🪔');
                countdownGridEl.style.display = 'none';
            }

            updateAudioForPhase(info);
            refreshBackground(info);
            setLocalizedText(countdownPillEl, formatPillText(info, now));
        }

        renderPhase();
        setInterval(renderPhase, 1000);

        const widget = document.getElementById('playerWidget');
        const icon = document.getElementById('playerIcon');
        icon.addEventListener('click', (e) => {
            e.stopPropagation();
            const opening = !widget.classList.contains('expanded');
            widget.classList.toggle('expanded');
            if (opening) {
                setCountdownExpanded(false); // only one panel open at a time
                trackListEl.classList.add('open'); // playlist shows by default on open
            }
        });
        document.addEventListener('click', (e) => {
            if (widget.classList.contains('expanded') && !widget.contains(e.target)) {
                widget.classList.remove('expanded');
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && widget.classList.contains('expanded')) {
                widget.classList.remove('expanded');
            }
        });

        playBtn.addEventListener('click', () => {
            if (!playingBucket) return;
            if (audioEl.paused) {
                audioEl.play().catch(() => {});
            } else {
                audioEl.pause();
            }
        });
        prevBtn.addEventListener('click', () => {
            if (!playingBucket) return;
            playFromBucket(playingBucket, playingIndex - 1, !audioEl.paused);
        });
        nextBtn.addEventListener('click', () => {
            if (!playingBucket) return;
            playFromBucket(playingBucket, playingIndex + 1, !audioEl.paused);
        });
        audioEl.addEventListener('play', () => {
            hasEverPlayed = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = '';
            playBtn.setAttribute('aria-label', 'Pause');
            icon.classList.add('playing');
        });
        audioEl.addEventListener('pause', () => {
            playIcon.style.display = '';
            pauseIcon.style.display = 'none';
            playBtn.setAttribute('aria-label', 'Play');
            icon.classList.remove('playing');
        });
        audioEl.addEventListener('ended', () => {
            if (!playingBucket) return;
            const tracks = bucketCache[playingBucket] || [];
            const nextIndex = playingIndex + 1;
            if (nextIndex < tracks.length) playFromBucket(playingBucket, nextIndex, true);
        });
        audioEl.addEventListener('loadedmetadata', () => {
            durationLabel.textContent = formatTime(audioEl.duration);
        });
        audioEl.addEventListener('timeupdate', () => {
            if (!audioEl.duration || isSeeking) return;
            progressBar.value = (audioEl.currentTime / audioEl.duration) * 100;
            currentTimeLabel.textContent = formatTime(audioEl.currentTime);
        });
        progressBar.addEventListener('input', () => {
            isSeeking = true;
            if (audioEl.duration) {
                currentTimeLabel.textContent = formatTime((progressBar.value / 100) * audioEl.duration);
            }
        });
        progressBar.addEventListener('change', () => {
            if (audioEl.duration) {
                audioEl.currentTime = (progressBar.value / 100) * audioEl.duration;
            }
            isSeeking = false;
        });
    </script>
</body>
</html>

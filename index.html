<!DOCTYPE html>
<html>
<head>
    <title>My Pixel Space Site</title>
    <style>
        body {
            /* Use our pixel image, make it tile/repeat, and color the gaps black */
            background: #000000 url('space.png') repeat;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace; /* Retro font */
            text-align: center;
            padding-top: 50px;
            margin: 0;
            overflow-x: hidden;
            
            /* Tie the animation to the background moving down */
            animation: moveSpace 20s linear infinite;
            image-rendering: pixelated; /* Keeps the pixel image sharp, not blurry */
        }

        /* The animation logic that scrolls the background vertically */
        @keyframes moveSpace {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }

        h1 {
            text-shadow: 3px 3px #ff0055; /* Retro retro glow effect */
            font-size: 2.5rem;
        }

        img {
            border: 4px solid #ffffff;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <h1>Welcome to My Space Station!</h1>
    <p>Floating through the cosmos on Android...</p>
    
    <img src="profile.jpg" alt="Space Traveler">

</body>
</html>

    <script>
        // ===================================================================
        // Particle Engine (unchanged)
        // ===================================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1.5,
                speedX: (Math.random() - 0.5) * 0.8,
                speedY: (Math.random() - 0.5) * 0.8,
                alpha: Math.random() * 0.4 + 0.2
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.floor(p.size), Math.floor(p.size));
            });
            requestAnimationFrame(animate);
        }
        animate();

        // ===================================================================
        // Music Player
        // ===================================================================

        // Your playlist — add as many tracks as you want, in order.
        const TRACK_LIST = ['music.flac', 'music2.flac', 'music3.flac',  'music4.flac'];
        let currentTrackIndex = 0;

        // Reads TITLE, ARTIST and LYRICS straight out of a FLAC file's
        // VORBIS_COMMENT metadata block — no external library needed.
        // Only requests the first 1MB of the file (metadata always sits
        // before the audio data), so it's cheap even on a large track.
        // Note: this needs the page served over http(s) — opening index.html
        // directly via file:// usually blocks the fetch, and the player will
        // fall back to "Unknown Title" / "Unknown Artist".
        async function readFlacMetadata(url) {
            try {
                const res = await fetch(url, { headers: { Range: 'bytes=0-1048575' } });
                if (!res.ok) throw new Error('Could not fetch audio file for tag reading');

                const buf = await res.arrayBuffer();
                const view = new DataView(buf);

                if (view.getUint32(0, false) !== 0x664c6143) { // "fLaC"
                    throw new Error('Not a FLAC file');
                }

                let offset = 4;
                let isLast = false;
                const tags = {};

                while (!isLast && offset + 4 <= buf.byteLength) {
                    const headerByte = view.getUint8(offset);
                    isLast = (headerByte & 0x80) !== 0;
                    const blockType = headerByte & 0x7f;
                    const blockLength =
                        (view.getUint8(offset + 1) << 16) |
                        (view.getUint8(offset + 2) << 8) |
                        view.getUint8(offset + 3);
                    const blockStart = offset + 4;

                    if (blockType === 4) { // VORBIS_COMMENT
                        let p = blockStart;
                        const vendorLength = view.getUint32(p, true); p += 4 + vendorLength;
                        const commentCount = view.getUint32(p, true); p += 4;

                        for (let i = 0; i < commentCount && p < buf.byteLength; i++) {
                            const len = view.getUint32(p, true); p += 4;
                            const bytes = new Uint8Array(buf, p, len);
                            const pair = new TextDecoder('utf-8').decode(bytes);
                            p += len;

                            const eq = pair.indexOf('=');
                            if (eq > -1) {
                                tags[pair.slice(0, eq).toUpperCase()] = pair.slice(eq + 1);
                            }
                        }
                        break; // found what we need
                    }

                    offset = blockStart + blockLength;
                }

                return {
                    title: tags.TITLE || null,
                    artist: tags.ARTIST || null,
                    lyrics: tags.LYRICS || tags.UNSYNCEDLYRICS || null
                };
            } catch (err) {
                console.warn('FLAC metadata read failed:', err.message);
                return { title: null, artist: null, lyrics: null };
            }
        }

        // ---- Elements ----

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // ---- Expand / collapse ----
        function toggleWidget() {
            const isOpen = widget.classList.toggle('expanded');
            if (isOpen) hint.style.display = 'none';
        }
        icon.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleWidget();
        });
        document.addEventListener('click', (e) => {
            if (widget.classList.contains('expanded') && !widget.contains(e.target)) {
                widget.classList.remove('expanded');
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && widget.classList.contains('expanded')) {
                widget.classList.remove('expanded');
            }
        });

        // ---- Site menu expand / collapse ----
        const navWidget = document.getElementById('navWidget');
        const navIcon = document.getElementById('navIcon');
        navIcon.addEventListener('click', (e) => {

            navWidget.classList.toggle('expanded');

        document.addEventListener('keydown', (e) => {

            playIcon.style.display = 'none';
            pauseIcon.style.display = '';
            playBtn.setAttribute('aria-label', 'Pause');
            icon.classList.add('playing');
        });
        audio.addEventListener('pause', () => {
            playIcon.style.display = '';
            pauseIcon.style.display = 'none';
            playBtn.setAttribute('aria-label', 'Play');
            icon.classList.remove('playing');
        });

        // ---- Progress bar (drag-to-seek without fighting playback updates) ----
        audio.addEventListener('loadedmetadata', () => {
            durationLabel.textContent = formatTime(audio.duration);
        });
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration || isSeeking) return;
            progressBar.value = (audio.currentTime / audio.duration) * 100;
            currentTimeLabel.textContent = formatTime(audio.currentTime);
        });
        progressBar.addEventListener('input', () => {
            isSeeking = true;
            if (audio.duration) {
                currentTimeLabel.textContent = formatTime((progressBar.value / 100) * audio.duration);
            }
        });
        progressBar.addEventListener('change', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
            isSeeking = false;
        });

        // ---- Lyrics ----
        lyricsBtn.addEventListener('click', () => {
            lyricsOpen = !lyricsOpen;
            lyricsPanel.classList.toggle('open', lyricsOpen);
            lyricsBtn.classList.toggle('active', lyricsOpen);
            if (lyricsOpen) lyricsPanel.textContent = lyricsText;
        });

        // ---- Playlist & Init ----
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');

        async function loadTrack(index, autoPlay = false) {
            const src = TRACK_LIST[index];
            audio.src = src;

            trackTitleEl.textContent = 'Loading…';
            trackArtistEl.textContent = '\u00A0';
            
            // FIX 3: Force collapse lyrics when song changes
            lyricsOpen = false;
            lyricsPanel.classList.remove('open');
            lyricsBtn.classList.remove('active');
            
            lyricsBtn.disabled = true;
            lyricsBtn.textContent = 'Lyrics';
            lyricsPanel.innerHTML = '';
            parsedLyrics = [];

            const meta = await readFlacMetadata(src);
            trackTitleEl.textContent = meta.title || src;
            trackArtistEl.textContent = meta.artist || 'Unknown Artist';
            lyricsText = meta.lyrics || null;

            if (lyricsText) {
                lyricsBtn.disabled = false;
                
                const lines = lyricsText.split('\n');
                // Regex for extracting the time calculation
                const timeRegEx = /\[(\d{2,}):(\d{2})\.(\d{1,3})\]/; 
                let isLRC = false;

                lines.forEach(line => {
                    const match = line.match(timeRegEx);
                    if (match) {
                        isLRC = true;
                        const time = parseInt(match[1]) * 60 + parseInt(match[2]) + parseFloat('0.' + match[3]);
                        
                        // FIX 2: Global regex to strip ALL timestamps from the visual text
                        const cleanText = line.replace(/\[\d{2,}:\d{2}\.\d{1,3}\]/g, '').trim();
                        
                        if (cleanText) {
                            const el = document.createElement('div');
                            el.className = 'lyric-line';
                            el.textContent = cleanText;
                            lyricsPanel.appendChild(el);
                            parsedLyrics.push({ time, el });
                        }
                    }
                });

                if (!isLRC) {
                    // Fallback: If it's not synced LRC, strip any malformed brackets just in case
                    lyricsPanel.textContent = lyricsText.replace(/\[.*?\]/g, '').trim();
                }
            } else {
                lyricsBtn.textContent = 'Lyrics unavailable';
            }

            if (autoPlay) audio.play().catch(() => {});
        }

        // Previous button click
        prevBtn.addEventListener('click', () => {
            // Adds TRACK_LIST.length before modulo to handle negative numbers
            currentTrackIndex = (currentTrackIndex - 1 + TRACK_LIST.length) % TRACK_LIST.length;
            loadTrack(currentTrackIndex, true);
        });

        // Next button click
        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % TRACK_LIST.length;
            loadTrack(currentTrackIndex, true);
        });

        // Auto-play next song when current finishes
        audio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % TRACK_LIST.length;
            loadTrack(currentTrackIndex, true);
        });

        // Initialize first track
        loadTrack(currentTrackIndex, false);

    </script>
</body>
</html>

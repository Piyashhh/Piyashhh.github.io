<!DOCTYPE html>
<html>
<head>
    <title>My Space Site</title>
    <style>
        body {
            /* Creates a moving digital gradient instead of using a space image */
            background: linear-gradient(125deg, #000000, #0f172a, #020617, #000000);
            background-size: 400% 400%;
            animation: moveSpace 10s ease infinite;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 50px;
            margin: 0;
            height: 100vh;
        }

        @keyframes moveSpace {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            text-shadow: 3px 3px #ff0055;
            font-size: 2.5rem;
        }

        img {
            border: 4px solid #ffffff;
            border-radius: 15px;
            margin-top: 20px;
            max-width: 80%;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Space Station!</h1>
    <p>Floating through the cosmos with my local phone photo...</p>
    
    <img src="profile.jpg" alt="Space Traveler">

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>My Personal Space</title>
    <style>
        /* This is CSS for styling your background and layout */
        body {
            background-color: #1e293b; /* Dark slate background color */
            color: #ffffff;            /* White text color */
            font-family: Arial, sans-serif;
            text-align: center;        /* Centers everything on screen */
            padding-top: 50px;
        }
        /* This styles your image */
        img {
            border-radius: 15px;       /* Gives smooth rounded corners */
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* Adds a drop shadow */
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website!</h1>
    <p>Hello from my Android phone!</p>
    
    <!-- This tag displays your image -->
    <img src="profile.jpg" alt="My Profile Picture">

</body>
</html>
